<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e2e8f0 0%, #f8fafc 100%);

        }

        .container {
            background-color: #ffffff;

        .container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Menu Styles */
        .menu-title {
            font-size: 2.2em;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 15px;
            text-align: center;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .menu-desc { text-align: center; margin-bottom: 35px; font-size: 1.15em; color: #64748b; font-weight: 600; }

            font-weight: 700;
            color: #475569;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            padding-left: 25px;
        }
        .set-btn:hover { 
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-color: transparent; 
            color: #fff; 
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2);
        }

        /* Quiz Styles */
        #quiz-screen, #result-screen { display: none; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 1.2em;
            font-weight: 700;
            color: #64748b;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
        }
        #set-title { color: #3b82f6; }

        .question-text { font-size: 1.4em; margin-bottom: 30px; font-weight: 700; color: #1e293b; line-height: 1.4; }
        
        .options-container { display: flex; flex-direction: column; gap: 15px; }
        
        .option-btn {
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 1.1em;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-weight: 600;
            color: #475569;
        }
        .option-btn:hover { background-color: #f8fafc; border-color: #cbd5e1; }
        .option-btn.selected { 
            background-color: #eff6ff; 
            border-color: #3b82f6; 
            color: #1d4ed8; 
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.1);
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 35px;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .btn-prev { background-color: #f1f5f9; color: #475569; }
        .btn-prev:hover { background-color: #e2e8f0; color: #1e293b; }
        
        .btn-next { background-color: #3b82f6; color: #fff; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2); }
        .btn-next:hover { background-color: #2563eb; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(59, 130, 246, 0.3); }
        
        .btn-submit { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2); }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3); }

        /* Result Styles */
        .result-header { text-align: center; margin-bottom: 40px; padding: 30px; background: #f8fafc; border-radius: 20px; }
        .final-score { font-size: 3em; font-weight: 800; color: #10b981; }
        
        .review-box {
            background-color: #ffffff;
            border: 2px solid #f1f5f9;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: left;
            box-shadow: 0 4px 6px rgba(148, 163, 184, 0.05);
        }
        .review-q { font-weight: 700; font-size: 1.2em; margin-bottom: 15px; color: #1e293b; }
        .review-ans { margin-bottom: 8px; font-size: 1.05em; }
        .ans-correct { color: #059669; font-weight: 700; }
        .ans-wrong { color: #e11d48; text-decoration: line-through; margin-right: 10px; font-weight: 600; }
        .review-exp {
            margin-top: 20px;
            padding: 18px;
            background-color: #f0fdfa;
            border-left: 5px solid #0d9488;
            border-radius: 8px;
            font-size: 1em;
            color: #0f766e;
            font-weight: 600;
            line-height: 1.5;
        }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container fade-in" id="main-container">
        
        <div id="menu-screen">
            <div class="menu-title">Data Link & Physical Layer MCQ</div>
            <p class="menu-desc">මේ අලුත් සෙට් එක තියෙන්නේ Network Layer එකෙන් පස්සේ එන Layer 2 (Data Link) සහ Layer 1 (Physical) ගැන. කැමති සෙට් එකක් තෝරලා ගේම ගහ​මු!</p>
            <button class="set-btn" onclick="startQuiz(0)">Set 1: Data Link Fundamentals & Framing (1-10)</button>
            <button class="set-btn" onclick="startQuiz(1)">Set 2: ARP & Error Detection (11-20)</button>
            <button class="set-btn" onclick="startQuiz(2)">Set 3: Ethernet & CSMA/CD (21-30)</button>
            <button class="set-btn" onclick="startQuiz(3)">Set 4: Switches, VLANs & MPLS (31-40)</button>
            <button class="set-btn" onclick="startQuiz(4)">Set 5: Physical Layer & Subnetting (41-50)</button>
        </div>

        <div id="quiz-screen">
            <div class="header">
                <span id="set-title">Set 1</span>
                <span id="question-counter">Q: 1/10</span>
            </div>
            <div class="question-text" id="question">Loading...</div>
            <div class="options-container" id="options"></div>
            
            <div class="nav-buttons">
                <button class="btn btn-prev" id="prev-btn"></button>
                <button class="btn btn-next" id="next-btn" onclick="nextQuestion()">Next (ඊළඟ) &rarr;</button>
            </div>
        </div>

        <div id="result-screen">
            <div class="result-header">
                <div class="final-score" id="final-score">Score: 0/10</div>
                <p id="result-message" style="font-size: 1.3em; color: #475569; margin-top: 15px; font-weight: 700;"></p>
                <div style="margin-top: 25px; display: flex; gap: 15px; justify-content: center;">
                    <button class="btn btn-prev" onclick="showMenu()">Main Menu</button>
                    <button class="btn btn-next" onclick="startQuiz(currentSetIndex)">Retake This Set</button>
                </div>
            </div>
            <h3 style="border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; color: #1e293b; font-size: 1.5em;">විවරණ (Review & Explanations)</h3>
            <div id="review-container"></div>
            <div style="text-align: center; margin-top: 40px;">
                <button class="btn btn-next" onclick="showMenu()">Back to Main Menu</button>
            </div>
        </div>

    </div>

    <script>
        const quizSets = [
            { // SET 1: Data Link Fundamentals & Framing
                title: "Set 1: Data Link Fundamentals & Framing",
                questions: [
                    { q: "1. What is the primary Protocol Data Unit (PDU) of the Data Link Layer?", options: ["Packet", "Segment", "Frame", "Bit"], a: 2, exp: "Data Link Layer එකේදී ඩේටා හඳුන්වන්නේ 'Frame' (ෆ්‍රේම්) කියලා. Network layer එකේදී ඒකට කියන්නේ 'Packet' කියලයි." },
                    { q: "2. Which sublayer of the Data Link Layer interfaces directly with the Network Layer?", options: ["MAC", "LLC", "PHY", "CSMA"], a: 1, exp: "LLC (Logical Link Control) sublayer එකෙන් තමයි ඊට උඩින් තියෙන Network layer එකත් එක්ක කතා කරන්නේ. ඒකෙන් protocols අඳුරගන්නවා." },
                    { q: "3. Which sublayer is responsible for hardware addressing and accessing the network media?", options: ["MAC", "LLC", "IP", "TCP"], a: 0, exp: "MAC (Media Access Control) sublayer එකෙන් තමයි hardware address (MAC address) දාන්නේ සහ වයර් එකට/වයිෆයි වලට ඩේටා දාන විදිහ පාලනය කරන්නේ." },
                    { q: "4. In a frame, what is used to indicate the beginning and the end of the payload?", options: ["IP Addresses", "Framing Flags", "Port Numbers", "Subnet Masks"], a: 1, exp: "ෆ්‍රේම් එකක් පටන් ගන්නේ සහ ඉවර වෙන්නේ කොතනින්ද කියලා ලබන්නාට අඳුරගන්න දාන විශේෂ බිට්ස් වලට 'Framing Flags' කියලා කියනවා." },
                    { q: "5. Which of the following is NOT a fundamental service provided by the Data Link layer?", options: ["Framing", "Error Detection", "Logical Routing", "Link Access"], a: 2, exp: "Logical Routing කියන්නේ Network Layer (Layer 3) එකේ වැඩක්. Data Link layer එකෙන් කරන්නේ ළඟම තියෙන ඊළඟ රවුටරේට ඩේටා යවන එක (hop-to-hop) විතරයි." },
                    { q: "6. What is the standard broadcast MAC address?", options: ["00:00:00:00:00:00", "255.255.255.255", "FF:FF:FF:FF:FF:FF", "11:11:11:11:11:11"], a: 2, exp: "Broadcast MAC address එකේ බිට්ස් 48ම '1' වෙනවා. ඒක Hexadecimal වලින් ලිව්වම FF:FF:FF:FF:FF:FF විදිහට වැටෙනවා." },
                    { q: "7. What is the standard size of an Ethernet MAC address?", options: ["32 bits", "48 bits", "64 bits", "128 bits"], a: 1, exp: "MAC address එකක් අනිවාර්යයෙන්ම බිට්ස් 48ක් (බයිට්ස් 6ක්) දිගයි. ඒකයි ඒක ඉලක්කම්/අකුරු 12කින් (Hexadecimal) ලියන්නේ." },
                    { q: "8. What does 'Half-duplex' communication mean?", options: ["Data flows only in one direction", "Data flows in both directions simultaneously", "Data flows in both directions, but not at the same time", "Data is encrypted before sending"], a: 2, exp: "Half-duplex වලදී පැති දෙකටම ඩේටා යවන්න පුළුවන්, හැබැයි එකම වෙලාවෙ බැහැ (උදා: Walkie-talkie). Full-duplex වලදී එකම වෙලාවෙ යවන්නත් ගන්නත් පුළුවන්." },
                    { q: "9. The physical address permanently burned into a Network Interface Card (NIC) is known as:", options: ["IP Address", "Socket Address", "MAC Address", "Gateway Address"], a: 2, exp: "NIC (Network Interface Card) එක හදපු කම්පැණියෙන්ම ඒකට ගහලා තියෙන නොමැකෙන ලිපිනයට කියන්නේ MAC address කියලයි." },
                    { q: "10. Which network topology connects all devices to a single central device, like a switch?", options: ["Bus", "Ring", "Mesh", "Star"], a: 3, exp: "Star topology එකේදී හැම මැෂින් එකක්ම මැද තියෙන එකම Switch එකකට හරි Hub එකකට හරි වයර් වලින් සම්බන්ධ කරලා තියෙනවා." }
                ]
            },
            { // SET 2: ARP & Error Detection
                title: "Set 2: ARP & Error Detection",
                questions: [
                    { q: "11. Which technique uses a single extra bit to detect if an odd number of bit errors occurred?", options: ["Checksum", "Parity Check", "CRC", "Forward Error Correction"], a: 1, exp: "Parity Check වලදී ඩේටා එකට අමතරව තව එක බිට් එකක් (extra bit) එකතු කරනවා 1 ඒවා ගාණ ඔත්තේ ද ඉරට්ටේ ද කියලා බලන්න. මේක සරල ක්‍රමයක්." },
                    { q: "12. In networking, CRC stands for:", options: ["Cyclic Redundancy Check", "Central Routing Control", "Carrier Routing Check", "Continuous Rate Control"], a: 0, exp: "CRC (Cyclic Redundancy Check) කියන්නේ ෆ්‍රේම් එකක් යද්දී ඒකෙ බිට්ස් වල වැරදි (errors) තියෙනවද කියලා හොයන්න පාවිච්චි කරන ශක්තිමත් ගණිතමය ක්‍රමයක්." },
                    { q: "13. In CRC error detection, the sender and receiver must mathematically agree on a common:", options: ["IP Address", "Generator Polynomial", "MAC Address", "Port Number"], a: 1, exp: "CRC හරියට වැඩ කරන්න නම් යවන කෙනයි ගන්න කෙනයි දෙන්නම බෙදීම කරන්න එකම 'Generator Polynomial' (බෙදුම්කාරකය) පාවිච්චි කරන්න ඕනේ." },
                    { q: "14. What is the primary purpose of the Address Resolution Protocol (ARP)?", options: ["Map a Domain Name to an IP", "Map a MAC address to an IP", "Map an IP address to a MAC address", "Route packets to the internet"], a: 2, exp: "ARP එකේ ප්‍රධානම වැඩේ තමයි, IP address එකක් දුන්නම ඒ අදාල මැෂින් එකේ MAC address එක මොකක්ද කියලා හොයලා දෙන එක." },
                    { q: "15. How is an ARP Request message typically sent across a local network?", options: ["As a Unicast", "As a Multicast", "As a Broadcast", "As an Anycast"], a: 2, exp: "ARP Request එකක් හැමතිස්සෙම යවන්නේ Broadcast (FF:FF:FF:FF:FF:FF) එකක් විදිහට. එතකොට නෙට්වර්ක් එකේ ඉන්න හැමෝටම ඒක ඇහෙනවා." },
                    { q: "16. How is an ARP Reply message typically sent back to the requester?", options: ["As a Broadcast", "As a Unicast", "As a Multicast", "It is not sent back"], a: 1, exp: "ARP reply එක යවන්නේ අර අහපු මැෂින් එකට විතරයි. ඒ කියන්නේ ඒක direct යවන Unicast මැසේජ් එකක්." },
                    { q: "17. If a laptop connects to a different WiFi network and gets a new IP address, what happens to its MAC address?", options: ["It changes to match the network", "It remains the same", "It becomes a broadcast address", "It is temporarily deleted"], a: 1, exp: "MAC address එක හාඩ්වෙයාර් එකටම ෆික්ස් කරලා තියෙන්නේ. ඒක නිසා ලැප් එක වෙන කොහේ ගිහින් අලුත් IP එකක් ගත්තත් MAC එක වෙනස් වෙන්නේ නෑ." },
                    { q: "18. Which command is commonly used in Windows/Linux to view the local ARP cache?", options: ["ipconfig", "ping", "arp -a", "tracert"], a: 2, exp: "'arp -a' කියන කමාන්ඩ් එක ගැහුවාම මැෂින් එකේ සේව් වෙලා තියෙන ARP cache එක (IP එකට අදාල MAC එක) බලාගන්න පුළුවන්." },
                    { q: "19. Which protocol was historically used to find an IP address when only the MAC address was known?", options: ["DNS", "DHCP", "RARP", "OSPF"], a: 2, exp: "ඉස්සර MAC address එක විතරක් දන්න වෙලාවට IP එක හොයාගන්න RARP (Reverse ARP) පාවිච්චි කළා. දැන් ඒ වැඩේ කරන්නේ DHCP වලින්." },
                    { q: "20. Why does ARP only work within a local area network (LAN)?", options: ["Routers block broadcasts", "MAC addresses are only 32 bits", "Switches delete ARP packets", "It uses UDP ports"], a: 0, exp: "රවුටර් එකකින් කවදාවත් Broadcast මැසේජ් එකක් (ARP වගේ) අනිත් පැත්තට පාස් කරන්නේ නෑ. ඒක නිසා ARP වැඩ කරන්නේ තමන්ගේ LAN එක ඇතුළෙ විතරයි." }
                ]
            },
            { // SET 3: Ethernet & CSMA/CD
                title: "Set 3: Ethernet & CSMA/CD",
                questions: [
                    { q: "21. What does CSMA/CD stand for?", options: ["Carrier Sense Multiple Access with Collision Detection", "Channel Sense Multiple Access with Collision Domain", "Carrier Signal Multiple Access with Connection Detection", "Control System Media Access with Collision Detection"], a: 0, exp: "Ethernet වලදී collisions (ගැටීම්) අඳුරගන්න පාවිච්චි කරන්නේ CSMA/CD (Carrier Sense Multiple Access with Collision Detection) කියන ක්‍රමයයි." },
                    { q: "22. In CSMA/CD, what must a device do BEFORE it starts transmitting data?", options: ["Send a jam signal", "Listen to the channel to see if it's idle", "Broadcast its IP address", "Wait for an ACK"], a: 1, exp: "මැෂින් එකක් ඩේටා යවන්න කලින් අනිවාර්යයෙන්ම වයර් එකට කන්දීලා බලනවා (Listen) වෙන කවුරුහරි ඒ වෙලාවෙ ඩේටා යවනවද කියලා. යවන්නේ නැත්නම් (idle නම්) විතරයි යවන්නේ." },
                    { q: "23. What happens immediately after a collision is detected in an Ethernet network?", options: ["The switch shuts down", "Devices transmit faster", "A jam signal is sent and devices stop transmitting", "Packets are rerouted"], a: 2, exp: "ගැටීමක් (Collision) වුණ ගමන්ම 'Jam Signal' එකක් යවනවා හැමෝටම දැනගන්න. ඊටපස්සේ ඩේටා යවන එක නතර කරලා ටික වෙලාවක් බලන් ඉන්නවා." },
                    { q: "24. What algorithm is used by CSMA/CD to determine how long a device should wait after a collision?", options: ["Dijkstra's Algorithm", "Binary Exponential Backoff", "Round Robin", "Distance Vector"], a: 1, exp: "ගැටීමකින් පස්සේ කොච්චර වෙලාවක් බලන් ඉන්න ඕනෙද කියලා ගණනය කරන්නේ 'Binary Exponential Backoff' කියන ඇල්ගොරිතම එකෙන්." },
                    { q: "25. As consecutive collisions occur for the same frame, the random backoff time interval:", options: ["Decreases", "Remains constant", "Doubles exponentially", "Resets to zero"], a: 2, exp: "එකම ෆ්‍රේම් එක යවද්දි දිගටම ගැටීම් (collisions) වෙනවා නම්, අර බලන් ඉන්න ඕනෙ කාලය (backoff time) දෙගුණ වෙවී (exponentially) වැඩි වෙනවා ට්‍රැෆික් එක අඩු කරන්න." },
                    { q: "26. While wired Ethernet uses CSMA/CD, what does wireless (Wi-Fi) use to avoid collisions?", options: ["CSMA/CA", "ALOHA", "Token Passing", "MPLS"], a: 0, exp: "Wi-Fi (802.11) වලදී collision එකක් වුණාම හොයාගන්න අමාරු නිසා, ඒකෙදි පාවිච්චි කරන්නේ ගැටීම් වළක්වාගන්න (Collision Avoidance) CSMA/CA කියන ක්‍රමයයි." },
                    { q: "27. What is the minimum frame size required for standard Ethernet to reliably detect collisions?", options: ["32 bytes", "64 bytes", "128 bytes", "1500 bytes"], a: 1, exp: "Ethernet ෆ්‍රේම් එකක් අනිවාර්යයෙන්ම අවම වශයෙන් බයිට්ස් 64ක් (64 bytes) දිග වෙන්න ඕනේ. ඊට වඩා අඩු නම් ඒවට කියන්නේ 'runt frames' කියලා." },
                    { q: "28. What describes a 'Collision Domain'?", options: ["A network area where data packets can collide", "A physical switch port", "The internet backbone", "A DNS server zone"], a: 0, exp: "Collision Domain එකක් කියන්නේ නෙට්වර්ක් එකේ එකම වෙලාවෙ දෙන්නෙක් ඩේටා යැව්වොත් ඒ ඩේටා දෙක හැප්පෙන්න (collide වෙන්න) පුළුවන් කලාපයටයි." },
                    { q: "29. A standard network Hub creates how many collision domains?", options: ["One for each port", "Zero", "One single collision domain for all ports", "Depends on the IP addresses"], a: 2, exp: "Hub කියන්නේ මෝඩ ඩිවයිස් එකක්. ඒකෙන් ඔක්කොම පෝට්ස් එකම ලොකු වයර් එකකට සෙට් කරනවා වගේ වැඩක් කරන්නේ. ඒක නිසා මුළු Hub එකම එකම එක Collision Domain එකක් වෙනවා." },
                    { q: "30. A 24-port Ethernet Switch creates how many collision domains?", options: ["1", "12", "24", "48"], a: 2, exp: "Switch එකක තියෙන හැම පෝට් එකක්ම වෙන් වෙන්ව වැඩ කරන නිසා, ඒ හැම පෝට් එකක්ම වෙනම Collision Domain එකක් වෙනවා. ඒ කියන්නේ 24ක් තියෙනවා." }
                ]
            },
            { // SET 4: Switches, VLANs & MPLS
                title: "Set 4: Switches, VLANs & MPLS",
                questions: [
                    { q: "31. A Layer 2 Ethernet Switch forwards frames based entirely on:", options: ["Source IP Address", "Destination IP Address", "Destination MAC Address", "TCP Port Numbers"], a: 2, exp: "Layer 2 Switch එකක් ෆ්‍රේම් එකක් යවන්න ඕනෙ කොහාටද කියලා තීරණය කරන්නේ ඒකෙ තියෙන 'Destination MAC Address' (ලබන්නාගේ MAC එක) දිහා බලලයි." },
                    { q: "32. How does a Switch learn and build its MAC Address Table?", options: ["By asking the DNS server", "By reading the Source MAC address of incoming frames", "By broadcasting ARP requests", "By reading the Destination IP"], a: 1, exp: "ස්විච් එකක් තමන්ගේ MAC Table එක හදාගන්නේ, ෆ්‍රේම් එකක් ඇතුළට එද්දි ඒකෙ තියෙන 'Source MAC address' (යවන්නාගේ MAC එක) කියවලා ඒක අදාල පෝට් එකට සේව් කරගෙනයි." },
                    { q: "33. What action does a switch take if the Destination MAC address is NOT in its MAC table?", options: ["Drops the frame", "Returns it to sender", "Floods the frame out of all ports except the incoming port", "Stores it in memory permanently"], a: 2, exp: "යවන්න ඕනෙ කාටද (Destination MAC) කියලා ස්විච් එක දන්නේ නැත්නම්, ඒක ආපු පෝට් එක ඇරෙන්න අනිත් හැම පෝට් එකකටම ඒ ෆ්‍රේම් එක යවනවා (මේකට කියන්නේ Flooding)." },
                    { q: "34. What is a VLAN (Virtual LAN)?", options: ["A wireless network", "A logical grouping of devices on a switch regardless of physical location", "A type of VPN", "A physical cable connection"], a: 1, exp: "VLAN එකකින් කරන්නේ එකම ස්විච් එකේ තියෙන මැෂින්ස් භෞතිකව කොහේ තිබ්බත් ලොජිකල් විදිහට වෙන් වෙන් නෙට්වර්ක් වලට කඩන එකයි." },
                    { q: "35. Which IEEE standard is commonly used for VLAN tagging?", options: ["802.11", "802.3", "802.1Q", "802.11ac"], a: 2, exp: "ෆ්‍රේම් එකක් අයිති මොන VLAN එකටද කියලා අඳුරගන්න ඒකට Tag එකක් ගහන්නේ IEEE 802.1Q කියන standard එක පාවිච්චි කරලයි." },
                    { q: "36. A switch port configured to carry traffic for MULTIPLE VLANs is called a:", options: ["Access Port", "Trunk Port", "Console Port", "Mirror Port"], a: 1, exp: "VLANs ගොඩක ඩේටා එකම පෝට් එකකින් (ගොඩක් වෙලාවට ස්විච් දෙකක් අතර) යවන්න හදපු පෝට් එකකට කියන්නේ Trunk Port කියලයි." },
                    { q: "37. MPLS routes packets primarily based on:", options: ["Long IP routing table lookups", "Short Path Labels", "MAC Addresses", "Domain Names"], a: 1, exp: "MPLS (Multiprotocol Label Switching) වලදී රවුටර් දිග IP addresses හොය හොය ඉන්නේ නැතුව, පැකට් එකට ගහලා තියෙන 'Short Labels' දිහා බලලා පට්ට ස්පීඩ් එකෙන් ෆෝවඩ් කරනවා." },
                    { q: "38. The primary benefit of using VLANs is:", options: ["Increasing physical link speed", "Isolating broadcast domains and improving security", "Providing wireless access", "Connecting directly to the Internet"], a: 1, exp: "VLANs වල ප්‍රධානම වාසිය තමයි ලොකු නෙට්වර්ක් එකක් පොඩි කොටස් වලට කඩලා Broadcast Domains වෙන් කරන එක. ඒකෙන් ට්‍රැෆික් එක අඩු වෙලා සෙකියුරිටි එක වැඩි වෙනවා." },
                    { q: "39. To allow communication BETWEEN two different VLANs, what device is strictly required?", options: ["A Layer 2 Hub", "A Repeater", "A Router (or Layer 3 Switch)", "A Modem"], a: 2, exp: "VLAN දෙකක් කියන්නේ වෙනස් නෙට්වර්ක් දෙකක් වගේ. ඒ දෙක අතරේ ඩේටා යවන්න නම් අනිවාර්යයෙන්ම රවුටරයක් (නැත්නම් Layer 3 Switch එකක්) ඕනෙ වෙනවා (Inter-VLAN Routing)." },
                    { q: "40. In a switch's MAC table, an entry typically consists of a MAC address and a:", options: ["IP Address", "Port Number", "Subnet Mask", "Domain Name"], a: 1, exp: "ස්විච් එකේ MAC table එකේ තියෙන්නේ ප්‍රධාන දේවල් දෙකයි: ඒ මැෂින් එකේ MAC Address එකයි, ඒක ස්විච් එකේ කනෙක්ට් වෙලා තියෙන Port Number එකයි." }
                ]
            },
            { // SET 5: Physical Layer & Subnetting
                title: "Set 5: Physical Layer & Subnetting",
                questions: [
                    { q: "41. The Physical Layer (Layer 1) transmits data across the medium as:", options: ["Frames", "Packets", "Raw Bits / Signals", "Segments"], a: 2, exp: "Physical layer එකේදී ඩේටා වල කිසිම හැඩයක් නෑ, ඒක කෙලින්ම 0 සහ 1 විදිහට (Raw Bits) කරන්ට් එකෙන්, ආලෝකයෙන් වගේ යවනවා." },
                    { q: "42. Which encoding scheme ensures a transition in the middle of EVERY bit period for clock synchronization?", options: ["NRZ", "Manchester Encoding", "AMI", "QAM"], a: 1, exp: "Manchester Encoding වලදී හැම බිට් එකකම හරි මැදදි අනිවාර්යයෙන්ම වෙනසක් (transition එකක්) වෙනවා. මේක Clock එක හදාගන්න පට්ට වැදගත් වෙනවා." },
                    { q: "43. According to Shannon's Capacity theorem, what happens if the Signal-to-Noise Ratio (SNR) increases?", options: ["Bandwidth decreases", "Channel capacity increases", "Error rate increases", "Data is lost"], a: 1, exp: "Shannon theorem (C = B * log2(1+SNR)) එකට අනුව, SNR එක (සිග්නල් එකේ හයිය) වැඩි වෙනකොට චැනල් එකේ යවන්න පුළුවන් උපරිම ඩේටා ප්‍රමාණයත් (Capacity) වැඩි වෙනවා." },
                    { q: "44. In the Nyquist theorem for noiseless channels, the maximum bit rate depends on:", options: ["Bandwidth and number of discrete signal levels", "Distance and cable type", "IP addresses and routing protocols", "MAC addresses"], a: 0, exp: "Nyquist සමීකරණය (C = 2B * log2(V)) වලට අනුව උපරිම වේගය තීරණය වෙන්නේ Bandwidth (B) එක සහ පාවිච්චි කරන වෝල්ටේජ් ලෙවල් ගාණ (V) මතයි." },
                    { q: "45. Subnetting: How many usable hosts are available in a /28 subnet?", options: ["14", "16", "30", "62"], a: 0, exp: "32 - 28 = 4 bits ඉතුරුයි හොස්ට්ලාට. 2^4 = 16යි. ඒකෙන් Network එකයි Broadcast එකයි අඩු කරාම පාවිච්චි කරන්න පුළුවන් (Usable) 14යි." },
                    { q: "46. What is the correct decimal subnet mask for a /27 prefix?", options: ["255.255.255.192", "255.255.255.224", "255.255.255.240", "255.255.255.248"], a: 1, exp: "/27 කියන්නේ අන්තිම ඔක්ටෙට් එකේ බිට්ස් 3ක් On වෙලා (128 + 64 + 32 = 224). ඒ කියන්නේ මාස්ක් එක 255.255.255.224." },
                    { q: "47. The 'Magic Number' (Block Size) for a /26 subnet mask is:", options: ["16", "32", "64", "128"], a: 2, exp: "/26 මාස්ක් එක 255.255.255.192. Magic Number එක හොයන්නේ 256 - 192 = 64 (නැත්නම් 2^(32-26) = 64)." },
                    { q: "48. For a point-to-point WAN link where exactly 2 IP addresses are needed, which subnet mask is most efficient?", options: ["/24", "/28", "/30", "/32"], a: 2, exp: "රවුටර් දෙකක් අතර (Point-to-point) කනෙක්ෂන් එකකට හරියටම IP දෙකයි ඕනේ. ඒකට සුපිරියටම ගැලපෙන්නේ /30 මාස්ක් එක (2^2 - 2 = 2)." },
                    { q: "49. Which of the following is NOT determined by the Physical Layer?", options: ["Voltage levels", "Connector pinouts", "Logical IP Addressing", "Cable specifications"], a: 2, exp: "Logical IP Addressing (IP දාන එක) කරන්නේ Network Layer (Layer 3) එකෙන්. Physical layer එකෙන් කරන්නේ වයර්, පින්, වෝල්ටේජ් වගේ හාඩ්වෙයාර් වැඩ විතරයි." },
                    { q: "50. Which organization defines standard specifications like 802.3 (Ethernet) and 802.11 (Wi-Fi)?", options: ["IETF", "IEEE", "ICANN", "IANA"], a: 1, exp: "IEEE (Institute of Electrical and Electronics Engineers) ආයතනයෙන් තමයි Ethernet (802.3) සහ Wi-Fi (802.11) වගේ Networking standards ඔක්කොම හදන්නේ." }
                ]
            }
        ];

        let currentSetIndex = 0;
        let currentQIndex = 0;
        let userAnswers = [];

        const menuScreen = document.getElementById("menu-screen");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");
        const questionEl = document.getElementById("question");
        const optionsEl = document.getElementById("options");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const container = document.getElementById("main-container");

        function showMenu() {
            menuScreen.style.display = "block";
            quizScreen.style.display = "none";
            resultScreen.style.display = "none";
            container.className = "container fade-in";
            container.scrollTop = 0;
        }

        function startQuiz(index) {
            currentSetIndex = index;
            currentQIndex = 0;
            userAnswers = new Array(quizSets[index].questions.length).fill(null);
            
            menuScreen.style.display = "none";
            resultScreen.style.display = "none";
            quizScreen.style.display = "block";
            document.getElementById("set-title").innerText = quizSets[index].title;
            loadQuestion();
        }

        function loadQuestion() {
            optionsEl.innerHTML = "";
            
            quizScreen.classList.remove("fade-in");
            void quizScreen.offsetWidth; 
            quizScreen.classList.add("fade-in");
            container.scrollTop = 0;

            const currentSet = quizSets[currentSetIndex].questions;
            const currentQ = currentSet[currentQIndex];

            document.getElementById("question-counter").innerText = `Q: ${currentQIndex + 1} of ${currentSet.length}`;
            questionEl.innerText = currentQ.q;

            currentQ.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                if(userAnswers[currentQIndex] === idx) {
                    btn.classList.add("selected");
                }
                btn.onclick = () => selectAnswer(idx, btn);
                optionsEl.appendChild(btn);
            });

            if (currentQIndex === 0) {
                prevBtn.style.display = "inline-block";
                prevBtn.innerHTML = "&larr; Main Menu";
                prevBtn.onclick = showMenu;
            } else {
                prevBtn.style.display = "inline-block";
                prevBtn.innerHTML = "&larr; Back (ආපසු)";
                prevBtn.onclick = prevQuestion;
            }
            
            if (currentQIndex === currentSet.length - 1) {
                nextBtn.innerText = "Submit Exam \u2713";
                nextBtn.classList.remove("btn-next");
                nextBtn.classList.add("btn-submit");
            } else {
                nextBtn.innerText = "Next (ඊළඟ) \u2192";
                nextBtn.classList.remove("btn-submit");
                nextBtn.classList.add("btn-next");
            }
        }

        function selectAnswer(selectedIdx, btn) {
            userAnswers[currentQIndex] = selectedIdx;
            
            const allBtns = optionsEl.children;
            for(let i=0; i<allBtns.length; i++) {
                allBtns[i].classList.remove("selected");
            }
            btn.classList.add("selected");
        }

        function nextQuestion() {
            if (currentQIndex < quizSets[currentSetIndex].questions.length - 1) {
                currentQIndex++;
                loadQuestion();
            } else {
                if(userAnswers.includes(null)) {
                    if(!confirm("මචන් උඹ සමහර ප්‍රශ්න වලට උත්තර දීලා නෑ. එහෙම්මම Submit කරනවද?")) {
                        return; 
                    }
                }
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQIndex > 0) {
                currentQIndex--;
                loadQuestion();
            }
        }

        function showResults() {
            quizScreen.style.display = "none";
            resultScreen.style.display = "block";
            resultScreen.classList.add("fade-in");
            container.scrollTop = 0;
            
            const currentSet = quizSets[currentSetIndex].questions;
            let score = 0;
            let reviewHTML = "";

            currentSet.forEach((q, index) => {
                const userAns = userAnswers[index];
                const isCorrect = (userAns === q.a);
                if(isCorrect) score++;

                const userAnsText = (userAns !== null) ? q.options[userAns] : "උත්තර දීලා නෑ (Not Answered)";
                const correctAnsText = q.options[q.a];

                let ansHTML = "";
                if(isCorrect) {
                    ansHTML = `<div class="review-ans ans-correct">&#10004; ඔබේ පිළිතුර (Your Answer): ${userAnsText}</div>`;
                } else {
                    ansHTML = `
                        <div class="review-ans"><span class="ans-wrong">&#10008; ඔබේ පිළිතුර: ${userAnsText}</span></div>
                        <div class="review-ans ans-correct">&#10004; නිවැරදි පිළිතුර (Correct Answer): ${correctAnsText}</div>
                    `;
                }

                reviewHTML += `
                    <div class="review-box">
                        <div class="review-q">${q.q}</div>
                        ${ansHTML}
                        <div class="review-exp"><strong>විවරණය (Explanation):</strong> ${q.exp}</div>
                    </div>
                `;
            });

            document.getElementById("final-score").innerText = `Score: ${score} / ${currentSet.length}`;
            document.getElementById("review-container").innerHTML = reviewHTML;
            
            const msgEl = document.getElementById("result-message");
            if(score >= 10) {
                msgEl.innerText = "නියම​යි ඒ​යි! Love Youuu 😘❤️";
            } else if(score >= 8) {
                msgEl.innerText = "නියම​යි ඒ​යි! මේ සෙට් එක ඔයා​ට සුපිරියටම පුළුවන්. 🔥";
            } else if(score >= 5) {
                msgEl.innerText = "එලකිරි! හොඳයි. යට තියෙන විවරණ ටික කියවලා වැරදුණ තැන් හදාග​මු. 👍";
            } else {
                msgEl.innerText = "අවුලක් නෑ ඒ​යි. යට තියෙන විවරණ ටික අනිවාර්යයෙන් කියවලා ආයෙත් සෙට් එක කර​මු. 💪";
            }
        }
    </script>
</body>
</html>
